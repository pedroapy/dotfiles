# ── Rosé Pine Moon lock screen ───────────────────
# Each monitor shows its own current wallpaper, blurred
# (~/bin/wallpaper.sh keeps ~/.cache/wallpaper/<monitor> linked to it).

$base    = rgb(232136)
$surface = rgb(2a273f)
$muted   = rgb(6e6a86)
$subtle  = rgb(908caa)
$text    = rgb(e0def4)
$love    = rgb(eb6f92)
$gold    = rgb(f6c177)
$rose    = rgb(ea9a97)
$foam    = rgb(9ccfd8)
$iris    = rgb(c4a7e7)

general {
    hide_cursor = true
    grace = 3
}

background {
    monitor = DP-3
    path = ~/.cache/wallpaper/DP-3
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    vibrancy = 0.2
}

background {
    monitor = HDMI-A-1
    path = ~/.cache/wallpaper/HDMI-A-1
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    vibrancy = 0.2
}

# Fallback for any other monitor
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
}

# Big clock, left
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 120
    font_family = Inter Display Bold
    position = 90, 120
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A, %-d de %B"
    color = $iris
    font_size = 24
    font_family = Inter
    position = 96, 10
    halign = left
    valign = center
}

label {
    monitor =
    text = Hola, $USER
    color = $subtle
    font_size = 16
    font_family = Inter
    position = 96, -36
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $iris
    inner_color = rgba(232136cc)
    font_color = $text
    font_family = Inter
    fade_on_empty = false
    placeholder_text = <span foreground="##908caa">Contraseña…</span>
    hide_input = false
    rounding = 14
    check_color = $foam
    fail_color = $love
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $gold
    position = 96, -130
    halign = left
    valign = center
}
