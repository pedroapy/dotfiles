# ── Autostart ────────────────────────────────────

# Wallpaper
exec-once = swww-daemon

# Status bar
exec-once = waybar

# Notifications
exec-once = swaync

# Clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Authentication agent
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Network applet
exec-once = nm-applet --indicator

# Bluetooth applet
exec-once = blueman-applet

# Idle & lock
exec-once = hypridle

# Set cursor theme
exec-once = hyprctl setcursor catppuccin-macchiato-dark-cursors 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme catppuccin-macchiato-dark-cursors
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24

# GTK theme
exec-once = gsettings set org.gnome.desktop.interface gtk-theme Catppuccin-Macchiato-Standard-Blue-Dark
exec-once = gsettings set org.gnome.desktop.interface icon-theme Papirus-Dark
exec-once = gsettings set org.gnome.desktop.interface font-name 'Roboto 11'
