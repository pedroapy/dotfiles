# ── Autostart ────────────────────────────────────

# Wallpaper (Bing photo of the day)
exec-once = awww-daemon
exec-once = bash -c 'sleep 3 && ~/bin/get-wallpaper.sh'

# Status bar
exec-once = waybar

# Notifications (managed by systemd user service via D-Bus activation)
# exec-once = swaync

# Clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Authentication agent
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Network applet
exec-once = nm-applet --indicator

# Bluetooth applet
exec-once = blueman-applet

# Idle & lock
exec-once = hypridle

# Set cursor theme
exec-once = hyprctl setcursor catppuccin-macchiato-dark-cursors 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme catppuccin-macchiato-dark-cursors
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24

# GTK theme
exec-once = gsettings set org.gnome.desktop.interface gtk-theme catppuccin-macchiato-blue-standard+default
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface icon-theme Papirus-Dark
exec-once = gsettings set org.gnome.desktop.interface font-name 'Inter 11'
