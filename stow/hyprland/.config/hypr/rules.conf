# ── Window Rules ─────────────────────────────────

# Float by default
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(nemo)$
windowrule = float, class:^(imv)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = float, title:^(Open File)$
windowrule = float, title:^(Save File)$
windowrule = float, class:^(1Password)$

# Workspace assignments
windowrule = workspace 2, class:^(firefox)$
windowrule = workspace 2, class:^(google-chrome)$
windowrule = workspace 3, class:^(code-url-handler)$
windowrule = workspace 4, class:^(spotify)$

# Opacity
windowrule = opacity 0.95 0.85, class:^(ghostty)$
windowrule = opacity 0.95 0.85, class:^(code-url-handler)$

# Size constraints for floating
windowrule = size 800 600, class:^(pavucontrol)$
windowrule = size 800 600, class:^(blueman-manager)$
