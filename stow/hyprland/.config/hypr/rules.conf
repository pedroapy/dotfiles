# ── Window Rules ─────────────────────────────────

# Float by default
windowrule {
    name = float-pavucontrol
    match:class = ^(pavucontrol)$
    float = on
    size = 800 600
}

windowrule {
    name = float-blueman
    match:class = ^(blueman-manager)$
    float = on
    size = 800 600
}

windowrule {
    name = float-nm
    match:class = ^(nm-connection-editor)$
    float = on
}

windowrule {
    name = float-nemo
    match:class = ^(nemo)$
    float = on
    size = 1200 800
}

windowrule {
    name = float-imv
    match:class = ^(imv)$
    float = on
}

windowrule {
    name = float-pip
    match:title = ^(Picture-in-Picture)$
    float = on
}

windowrule {
    name = float-openfile
    match:title = ^(Open File)$
    float = on
}

windowrule {
    name = float-savefile
    match:title = ^(Save File)$
    float = on
}

windowrule {
    name = float-1password
    match:class = ^(1Password)$
    float = on
}

# Workspace assignments
windowrule {
    name = ws-firefox
    match:class = ^(firefox)$
    workspace = 2
}

windowrule {
    name = ws-brave
    match:class = ^(brave-browser)$
    workspace = 2
}

windowrule {
    name = ws-chrome
    match:class = ^(google-chrome)$
    workspace = 2
}

windowrule {
    name = ws-vscode
    match:class = ^(code-url-handler)$
    workspace = 3
}

windowrule {
    name = ws-spotify
    match:class = ^(spotify)$
    workspace = 4
}

# Opacity
windowrule {
    name = opacity-ghostty
    match:class = ^(ghostty)$
    opacity = 0.95 0.85
}

windowrule {
    name = opacity-vscode
    match:class = ^(code-url-handler)$
    opacity = 0.95 0.85
}

# Suppress maximize events
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}
