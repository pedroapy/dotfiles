# ── Window Rules ─────────────────────────────────

# Float by default
windowrule {
    match:class = ^(pavucontrol)$
    float = on
    size = 800 600
}

windowrule {
    match:class = ^(blueman-manager)$
    float = on
    size = 800 600
}

windowrule {
    match:class = ^(nm-connection-editor)$
    float = on
}

windowrule {
    match:class = ^(nemo)$
    float = on
}

windowrule {
    match:class = ^(imv)$
    float = on
}

windowrule {
    match:title = ^(Picture-in-Picture)$
    float = on
}

windowrule {
    match:title = ^(Open File)$
    float = on
}

windowrule {
    match:title = ^(Save File)$
    float = on
}

windowrule {
    match:class = ^(1Password)$
    float = on
}

# Workspace assignments
windowrule {
    match:class = ^(firefox)$
    workspace = 2
}

windowrule {
    match:class = ^(brave-browser)$
    workspace = 2
}

windowrule {
    match:class = ^(google-chrome)$
    workspace = 2
}

windowrule {
    match:class = ^(code-url-handler)$
    workspace = 3
}

windowrule {
    match:class = ^(spotify)$
    workspace = 4
}

# Opacity
windowrule {
    match:class = ^(ghostty)$
    opacity = 0.95 0.85
}

windowrule {
    match:class = ^(code-url-handler)$
    opacity = 0.95 0.85
}

# Suppress maximize events
windowrule {
    match:class = .*
    suppress_event = maximize
}
