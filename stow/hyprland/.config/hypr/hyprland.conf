# ══════════════════════════════════════════════════
#  Hyprland Configuration
# ══════════════════════════════════════════════════

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/theme.conf

# ── GPU priority (RX 9070 dGPU first, Granite Ridge iGPU second) ─
env = AQ_DRM_DEVICES,/dev/dri/by-path/pci-0000:03:00.0-card:/dev/dri/by-path/pci-0000:74:00.0-card

# ── Input ────────────────────────────────────────
input {
    kb_layout = us,es
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ── General ──────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(8aadf4ee) rgba(c6a0f6ee) 45deg
    col.inactive_border = rgba(363a4faa)
    layout = dwindle
    allow_tearing = false
    resize_on_border = true
    extend_border_grab_area = 15
}

# ── Decoration ───────────────────────────────────
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 3
        xray = false
    }
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(181926ee)
    }
}

# ── Animations ───────────────────────────────────
animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 5, ease, slide
    animation = fade, 1, 4, ease
    animation = workspaces, 1, 4, ease, slide
    animation = border, 1, 10, ease
    animation = borderangle, 1, 30, ease, loop
}

# ── Layout ───────────────────────────────────────
dwindle {
    preserve_split = true
    smart_split = false
}

# ── Groups (stacked/tabbed) ──────────────────────
group {
    col.border_active = rgba(8aadf4ee) rgba(c6a0f6ee) 45deg
    col.border_inactive = rgba(363a4faa)
    col.border_locked_active = rgba(eed49fee) rgba(f5a97fee) 45deg
    col.border_locked_inactive = rgba(494d64aa)

    groupbar {
        enabled = true
        font_family = sans-serif
        font_size = 11
        height = 18
        gradients = true
        render_titles = true
        scrolling = true
        text_color = rgba(cad3f5ff)
        col.active = rgba(8aadf4ee)
        col.inactive = rgba(363a4faa)
        col.locked_active = rgba(eed49fee)
        col.locked_inactive = rgba(494d64aa)
    }
}

# ── Cursor ───────────────────────────────────────
cursor {
    inactive_timeout = 5
    hide_on_key_press = true
}

# ── Misc ─────────────────────────────────────────
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
}
