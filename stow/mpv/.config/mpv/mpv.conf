# ── Video ────────────────────────────────────────
vo=gpu-next
hwdec=auto-safe
profile=high-quality

# ── Behaviour ────────────────────────────────────
keep-open=yes
save-position-on-quit=yes
autofit-larger=80%x80%
screenshot-directory=~/captures
screenshot-template=mpv-%F-%P
slang=es,spa,en,eng
alang=es,spa,ja,jpn,en,eng

# ── Look (Rosé Pine Moon) ────────────────────────
background-color="#232136"
osd-font=Inter
osd-font-size=32
osd-color="#e0def4"
osd-border-color="#232136"
osd-bar-align-y=0.95
sub-font=Inter
sub-font-size=44
sub-color="#e0def4"
sub-border-color="#232136"
sub-border-size=2.5
